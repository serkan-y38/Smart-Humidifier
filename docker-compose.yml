services:
  # 1. Database
  mysql:
    image: mysql:8.0
    container_name: humidifier-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Europe/Istanbul
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # Pings the DB inside the container using its own env variable
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 2. Backend API (ESP32 and the dashboard talk to this)
  backend:
    build: ./humidifier-backend
    container_name: humidifier-backend
    restart: unless-stopped
    ports:
      - "3839:3839"
    environment:
      PORT: 3839
      API_KEY: ${API_KEY:?API_KEY is required}
      CORS_ORIGIN: http://${SERVER_HOST:?SERVER_HOST is required}:3840
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      TZ: Europe/Istanbul
    depends_on:
      mysql:
        condition: service_healthy

  # 3. Frontend (static files served by nginx)
  frontend:
    build:
      context: ./humidifier-frontend
      args:
        # Baked into the JavaScript bundle at build time
        VITE_API_BASE_URL: http://${SERVER_HOST}:3839
        VITE_API_KEY: ${API_KEY}
    container_name: humidifier-frontend
    restart: unless-stopped
    ports:
      - "3840:3840"
    depends_on:
      - backend

volumes:
  db_data: