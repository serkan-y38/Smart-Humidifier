server {
    listen 3840;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown routes are served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compress text-based assets
    gzip on;
    gzip_types text/css application/javascript application/json;
}